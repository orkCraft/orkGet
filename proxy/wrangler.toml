# The usage proxy of Orkline and Orkboard (README.md). The Amplitude key and the Sentry DSNs are secrets, never here:
#   npx wrangler secret put AMPLITUDE_API_KEY
#   npx wrangler secret put SENTRY_DSN               # Orkline's Sentry project
#   npx wrangler secret put SENTRY_DSN_ORKBOARD      # Orkboard's
# Its name and account stay as they are: every installed copy sends to https://orkcraft-usage.<account>.workers.dev.
name = "orkcraft-usage"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true                  # https://orkcraft-usage.<account>.workers.dev, or a route below

# routes = [{ pattern = "usage.orkcraft.dev", custom_domain = true }]

[vars]
AMPLITUDE_REGION = "us"             # "us" (api2.amplitude.com) or "eu" (api.eu.amplitude.com): where the Amplitude project lives
SEND_COUNTRY = "false"              # "true": Cloudflare's guess of the country goes along (never the IP)

# At most 30 batches a minute from one install; a product sends one a minute.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[observability]
enabled = false                     # no request logs: they would hold the people's addresses
